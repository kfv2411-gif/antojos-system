<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojos by Dulce Delicias</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #d97706;
            font-size: 26px;
            margin-bottom: 15px;
        }
        p {
            color: #4b5563;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #d97706;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #b45309;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Antojos by Dulce Delicias</h1>
        <p>Espacio de trabajo colaborativo para Brenda y Kalena. Gestión y administración del sistema.</p>
        <a href="/admin/" class="btn">Ir al Panel de Administración</a>
    </div>
</body>
</html>
