databases:
  - name: antojosdb
    databaseName: antojos
    user: antojos_user

services:
  - type: web
    name: antojos-system
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn antojos_system.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antojosdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4